name: Build Study OS Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      # APP_VERSION_CODE = max(package.json 推导值, 10000 + GITHUB_RUN_NUMBER)
      # 避免本地升版本后，CI 仍用较小的 run_number 导致覆盖安装被拒
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/study-os.keystore
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          set -e
          MATCHES=$(grep -rInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=www --exclude-dir=dist --exclude-dir=build \
            'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::检测到疑似明文密钥，已中止打包"
            exit 1
          fi
          SECRET_FILES=$(find . -path ./.git -prune -o \( -name '*.keystore' -o -name '*.jks' -o -name 'local.properties' \) -print)
          if [ -n "$SECRET_FILES" ]; then
            echo "$SECRET_FILES"
            echo "::error::仓库内不应包含 keystore/jks/local.properties"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor dependencies
        run: npm install

      - name: Check CSS class consistency
        run: npm run check:classes

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          SDK=$ANDROID_HOME
          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync web files to Android
        run: |
          npm run sync:www
          npx cap sync android || npx cap copy android
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Restore signing keystore (optional)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/study-os.keystore
            echo "Keystore restored for signed release APK"
          else
            echo "::notice::未配置 ANDROID_KEYSTORE_BASE64，将自动构建可直接安装的 debug APK"
          fi

      - name: Compute unified versionCode
        run: |
          DERIVED=$(node -e "const v=require('./package.json').version.split('.').map(n=>parseInt(n,10)||0);console.log(v[0]*10000+(v[1]||0)*100+(v[2]||0))")
          RUNCODE=$((10000 + GITHUB_RUN_NUMBER))
          if [ "$DERIVED" -gt "$RUNCODE" ]; then CODE=$DERIVED; else CODE=$RUNCODE; fi
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionCode=$CODE (package.json 推导 $DERIVED, run_number 推导 $RUNCODE)"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -f app/study-os.keystore ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Collect APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk StudyOS-signed.apk
            echo "ARTIFACT_NAME=StudyOS-signed-APK" >> $GITHUB_ENV
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk StudyOS-debug.apk
            echo "ARTIFACT_NAME=StudyOS-debug-APK" >> $GITHUB_ENV
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: StudyOS-*.apk
          retention-days: 90
